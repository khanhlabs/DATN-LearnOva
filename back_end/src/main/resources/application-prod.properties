spring.config.activate.on-profile=prod
spring.datasource.url=${DB_URL}
spring.elasticsearch.uris=${ES_URIS:http://elasticsearch:9200}
app.frontend.base-url=${FRONTEND_BASE_URL}
server.cookie.secure=${COOKIE_SECURE:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
ai.service.base-url=${AI_SERVICE_URL:http://ai-service:8000}
ai.generation.backfill-enabled=${AI_GENERATION_BACKFILL_ENABLED:true}
ai.generation.backfill-batch-size=${AI_GENERATION_BACKFILL_BATCH_SIZE:10}
