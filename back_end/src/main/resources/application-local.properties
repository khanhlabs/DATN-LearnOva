spring.config.activate.on-profile=local
spring.flyway.enabled=true
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:86400000}
jwt.refresh-token-remember-expiration=${JWT_REFRESH_TOKEN_REMEMBER_EXPIRATION:2592000000}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/DATN}
spring.elasticsearch.uris=${ES_URIS:http://localhost:9200}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
server.cookie.secure=${COOKIE_SECURE:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}
